# マウス操作を有効化（tmux 2.1+ の新 syntax）
# wheel で copy-mode に入り scrollback を遡れる。
# tmux がホイールイベントを掴むため、ターミナル側の wheel→矢印キー変換が抑制され、
# tmux 内で動かす TUI（Claude Code 等）の選択肢がスクロールで勝手に動かなくなる。
set -g mouse on

# 選択範囲を macOS クリップボードへ（drag 終了時に pbcopy）
set -g set-clipboard on
if-shell "command -v pbcopy >/dev/null 2>&1" \
  "bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "command -v pbcopy >/dev/null 2>&1" \
  "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"

# scrollback を広めに
set -g history-limit 10000

# Audible bell for terminal/fanout notifications.
set -g bell-action any
set -g visual-bell off
setw -g monitor-bell on
set-hook -g alert-bell 'run-shell -b "command -v afplay >/dev/null 2>&1 && afplay /System/Library/Sounds/Ping.aiff >/dev/null 2>&1"'
